<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">AI Interview Preparation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="nav" th:fragment="nav(active)">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AI</span>
        Interview Prep
    </a>
    <nav class="nav-links">
        <a th:href="@{/}" th:classappend="${active == 'home'} ? ' is-active'">Home</a>
        <a href="/#how-it-works" th:classappend="${active == 'how'} ? ' is-active'">How It Works</a>
        <a href="/#technologies" th:classappend="${active == 'tech'} ? ' is-active'">Technologies</a>
        <a href="/#architecture" th:classappend="${active == 'arch'} ? ' is-active'">Architecture</a>
        <a class="btn btn-sm" th:href="@{/start}">Start Interview</a>
    </nav>
</header>
<footer class="footer" th:fragment="footer">
    <p>College academic project · Java · Spring Boot · Keyword matching evaluation (AI-style feedback, not a neural-network API)</p>
</footer>
</body>
</html>
